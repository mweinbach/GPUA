name: GPUIiOS

options:
  bundleIdPrefix: dev.glasshq
  deploymentTarget:
    iOS: "17.0"

packages:
  GPUA:
    path: ../..

settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"

targets:
  GPUIiOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: runner
    dependencies:
      - package: GPUA
        product: GPUI
      - package: GPUA
        product: GPUIPlatform
      - sdk: UIKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: Security.framework
      - sdk: UniformTypeIdentifiers.framework
    info:
      path: build/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSLocalNetworkUsageDescription: "GPUI streams debug logs to developer tools on the local network."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: dev.glasshq.GPUIiOS
            CFBundleURLSchemes:
              - gpui
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.glasshq.GPUIiOS
        PRODUCT_NAME: GPUIiOS
        PRODUCT_MODULE_NAME: GPUIiOSRunner
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_ENTITLEMENTS: Entitlements.plist
